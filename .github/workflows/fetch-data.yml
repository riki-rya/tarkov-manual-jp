name: 定期データ更新

on:
  schedule:
    # 毎週月曜日 UTC 00:00 (JST 09:00) に実行
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "更新対象 (all / items / tasks / hideout / traders)"
        required: false
        default: "all"

jobs:
  fetch:
    name: Tarkov.dev からデータを取得
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: データを取得
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          echo "取得対象: $TARGET"
          npm run fetch:$TARGET

      - name: 変更を確認
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 変更があればコミット・プッシュ
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: Tarkov.dev データを自動更新 ($(date -u '+%Y-%m-%d'))"
          git push

      - name: 変更なし
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "データに変更はありませんでした。"
